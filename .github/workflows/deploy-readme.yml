name: Deploy readme.txt and listing assets

on:
  push:
    branches: [ master ]
    paths:
      - 'src/readme.txt'
      - '.wordpress-org/**'
      - '.github/workflows/deploy-readme.yml'
  workflow_dispatch: {}

jobs:
  deploy-readme:
    runs-on: ubuntu-latest

    env:
      SLUG: theme-my-login
      SVN_URL: https://plugins.svn.wordpress.org/theme-my-login

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install svn
        run: sudo apt-get update -y && sudo apt-get install -y subversion

      - name: Push readme.txt to WordPress.org trunk
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail

          SVN_DIR="${HOME}/svn-${SLUG}"

          svn checkout --depth files "${SVN_URL}/trunk" "${SVN_DIR}"
          cp src/readme.txt "${SVN_DIR}/readme.txt"

          cd "${SVN_DIR}"

          if svn status | grep -q '^M'; then
            svn commit -m "Update readme.txt" --no-auth-cache --non-interactive --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}"
          else
            echo "readme.txt unchanged; nothing to commit."
          fi

      # Adds and updates only; an asset removed from .wordpress-org stays in SVN until deleted there.
      - name: Push .wordpress-org to WordPress.org assets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          set -euo pipefail

          ASSETS_DIR="${HOME}/svn-${SLUG}-assets"

          svn checkout "${SVN_URL}/assets" "${ASSETS_DIR}"
          cp -R .wordpress-org/. "${ASSETS_DIR}/"

          cd "${ASSETS_DIR}"
          svn add --force --quiet .

          shopt -s nullglob
          for f in *.png; do
            svn propset --quiet svn:mime-type image/png "$f"
          done
          for f in *.svg; do
            svn propset --quiet svn:mime-type image/svg+xml "$f"
          done

          if [ -n "$(svn status)" ]; then
            svn commit -m "Update listing assets" --no-auth-cache --non-interactive --username "${SVN_USERNAME}" --password "${SVN_PASSWORD}"
          else
            echo "Listing assets unchanged; nothing to commit."
          fi
