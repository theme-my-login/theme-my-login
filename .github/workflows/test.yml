name: Test

on:
  pull_request:
    branches: [ master ]

jobs:
  # wp-phpunit's version pins which WordPress core test suite gets
  # installed, so a green run here is also our "Tested up to" signal:
  # bump the wp-phpunit constraint in composer.json when a new WP version
  # ships, push, and a green run is the go-ahead to bump readme.txt.
  # tests/phpunit/multisite.xml existing is what makes tml-workflows run
  # the multisite suite too - shared with every tml-* extension, they
  # just don't have that file.
  test:
    uses: theme-my-login/tml-workflows/.github/workflows/test.yml@main

  build:
    uses: theme-my-login/tml-workflows/.github/workflows/build.yml@main
