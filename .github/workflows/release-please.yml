name: Release Please

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
      sha: ${{ steps.release-please.outputs.sha }}

    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Draft WordPress-style changelog onto the Release PR
        env:
          RELEASE_PLEASE_PR: ${{ steps.release-please.outputs.pr }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
        run: |
          set -euo pipefail

          branch=$(echo "$RELEASE_PLEASE_PR" | jq -r '.headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "No pending release-please PR found; skipping changelog draft."
            exit 0
          fi

          git fetch origin "$branch"
          git checkout "$branch"

          version=$(php -r '$m = json_decode(file_get_contents(".release-please-manifest.json"), true); echo $m["."];')

          php bin/draft-changelog.php "$version"

          if git diff --quiet -- src/readme.txt; then
            echo "No feat/fix/perf commits since last tag; nothing to draft."
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add src/readme.txt
          git commit -m "chore: draft changelog for ${version}"
          git push origin "$branch"

      - name: Request review from Jeff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PLEASE_PR: ${{ steps.release-please.outputs.pr }}
        run: |
          set -euo pipefail

          branch=$(echo "$RELEASE_PLEASE_PR" | jq -r '.headBranchName // empty')
          if [ -z "$branch" ]; then
            echo "No pending release-please PR found; skipping reviewer request."
            exit 0
          fi

          pr_number=$(gh pr list --repo ${{ github.repository }} --head "$branch" --json number --jq '.[0].number')
          gh pr edit "$pr_number" --repo ${{ github.repository }} --add-reviewer jfarthing84

  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
    secrets: inherit
